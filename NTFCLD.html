<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NoTificiansCloud 4.0</title>
  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }
    body{
      min-height:100vh;
      background:#111;
      background-size:cover;
      background-position:center;
      background-repeat:no-repeat;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      overflow:hidden;
      transition:background-image 0.5s ease;
    }
    .app-window{
      position:fixed;
      left:50%;
      top:50%;
      transform:translate(-50%,-50%) scale(0.85);
      width:min(85vw,700px);
      height:min(75vh,520px);
      min-width:360px;
      min-height:320px;
      border-radius:12px;
      overflow:visible;
      background:rgba(10,10,14,0.92);
      backdrop-filter:blur(20px) saturate(150%);
      -webkit-backdrop-filter:blur(20px) saturate(150%);
      border:1px solid rgba(255,255,255,0.05);
      box-shadow:0 16px 48px rgba(0,0,0,0.55);
      z-index:50;
      display:flex;
      flex-direction:column;
      opacity:0;
      visibility:hidden;
      pointer-events:none;
      isolation:isolate;
      transition:opacity 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), 
                 visibility 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), 
                 transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1),
                 box-shadow 0.3s ease;
    }
    .app-window.active{
      opacity:1;
      visibility:visible;
      pointer-events:auto;
      transform:translate(-50%,-50%) scale(1);
      box-shadow:0 24px 64px rgba(0,0,0,0.65);
    }
    .app-window.maximized{
      left:4px !important;
      top:4px !important;
      transform:none !important;
      width:calc(100vw - 8px) !important;
      height:calc(100vh - 76px) !important;
    }
    .window-header{
      display:flex;
      align-items:center;
      padding:8px 12px;
      background:rgba(0,0,0,0.12);
      border-bottom:1px solid rgba(255,255,255,0.04);
      cursor:move;
      user-select:none;
      flex-shrink:0;
    }
    .window-header-left{
      display:flex;
      align-items:center;
      gap:8px;
    }
    .window-header-logo{
      width:20px;
      height:20px;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      border-radius:4px;
      transition:background 0.12s ease;
    }
    .window-header-logo:hover{
      background:rgba(255,255,255,0.1);
    }
    .window-header-logo svg{
      width:16px;
      height:16px;
      stroke:#fff;
      stroke-width:1.5;
      fill:none;
      stroke-linecap:round;
      stroke-linejoin:round;
    }
    .window-title{
      font-size:13px;
      font-weight:500;
      color:rgba(255,255,255,0.85);
      letter-spacing:0.5px;
      font-family:'Georgia','Times New Roman',serif;
    }
    .window-controls{
      margin-left:auto;
      display:flex;
      gap:6px;
    }
    .window-btn{
      width:24px;
      height:24px;
      border-radius:6px;
      border:none;
      background:rgba(255,255,255,0.06);
      color:rgba(255,255,255,0.7);
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      transition:background 0.2s ease, transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .window-btn:hover{
      transform:scale(1.2);
      background:rgba(255,255,255,0.12);
      color:#fff;
    }
    .window-btn:active{
      transform:scale(0.85);
    }
    .window-btn.close:hover{
      background:rgba(255,80,80,0.6);
    }
    .window-btn svg{
      width:12px;
      height:12px;
      stroke:currentColor;
      stroke-width:2;
      fill:none;
      stroke-linecap:round;
      stroke-linejoin:round;
    }
    .window-content{
      flex:1;
      padding:20px;
      overflow:hidden;
      color:rgba(255,255,255,0.8);
    }
    .window-body{
      flex:1;
      display:flex;
      overflow:hidden;
      position:relative;
    }
    .window-sidebar{
      position:absolute;
      top:0;
      left:0;
      bottom:0;
      width:220px;
      background:rgba(10,10,14,0.1);
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
      border-right:1px solid rgba(255,255,255,0.06);
      z-index:10;
      transform:translateX(-100%);
      transition:transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      display:flex;
      flex-direction:column;
      padding:16px 0;
      isolation:isolate;
    }
    .window-sidebar.open{
      transform:translateX(0);
    }
    .window-sidebar-overlay{
      position:absolute;
      inset:0;
      z-index:5;
      display:none;
    }
    .window-sidebar-overlay.show{
      display:block;
    }
    .window-sidebar-header{
      padding:8px 16px 16px;
      border-bottom:1px solid rgba(255,255,255,0.06);
      margin-bottom:8px;
    }
    .window-sidebar-header h3{
      font-size:14px;
      font-weight:600;
      color:rgba(255,255,255,0.9);
      letter-spacing:0.5px;
    }
    .window-sidebar-nav{
      flex:1;
      overflow-y:auto;
      padding:4px 8px;
    }
    .window-sidebar-item{
      display:flex;
      align-items:center;
      gap:10px;
      padding:10px 12px;
      border-radius:6px;
      cursor:pointer;
      transition:background 0.12s ease, color 0.12s ease, transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
      color:rgba(255,255,255,0.7);
      font-size:13px;
      user-select:none;
    }
    .window-sidebar-item:hover{
      background:rgba(255,255,255,0.08);
      color:#fff;
      transform:scale(1.02);
    }
    .window-sidebar-item:active{
      transform:scale(0.97);
    }
    .window-sidebar-item.active{
      background:rgba(255,255,255,0.12);
      color:#fff;
    }
    .window-sidebar-item svg{
      width:16px;
      height:16px;
      stroke:currentColor;
      stroke-width:1.5;
      fill:none;
      stroke-linecap:round;
      stroke-linejoin:round;
      flex-shrink:0;
    }
    .terminal-body{
      flex:1;
      overflow-y:auto;
      font-family:"SF Mono","Cascadia Code","Fira Code","Consolas",monospace;
      font-size:13px;
      color:rgba(255,255,255,0.85);
      line-height:1.6;
    }
    .terminal-body::-webkit-scrollbar{
      width:6px;
    }
    .terminal-body::-webkit-scrollbar-track{
      background:transparent;
    }
    .terminal-body::-webkit-scrollbar-thumb{
      background:rgba(255,255,255,0.15);
      border-radius:3px;
    }
    .terminal-body::-webkit-scrollbar-thumb:hover{
      background:rgba(255,255,255,0.25);
    }
    .terminal-line{
      display:flex;
      align-items:flex-start;
      margin-bottom:2px;
    }
    .terminal-prompt{
      color:#28c840;
      white-space:nowrap;
      margin-right:8px;
      font-weight:600;
    }
    .terminal-output{
      color:rgba(255,255,255,0.7);
      word-break:break-all;
    }
    .terminal-input-line{
      display:flex;
      align-items:center;
      margin-top:4px;
    }
    .terminal-input{
      flex:1;
      background:transparent;
      border:none;
      outline:none;
      color:rgba(255,255,255,0.9);
      font-family:inherit;
      font-size:inherit;
      caret-color:#28c840;
    }
    .terminal-input::placeholder{
      color:rgba(255,255,255,0.2);
    }
    .terminal-welcome{
      color:rgba(255,255,255,0.5);
      margin-bottom:12px;
      line-height:1.8;
    }
  </style>
</head>
<body>
  <div class="app-window" id="cmdWindow">
    <div class="window-header" id="cmdHeader">
      <div class="window-header-left">
        <span class="window-title">NoTificiansCloudSimple CMD</span>
      </div>
      <div class="window-controls">
        <button class="window-btn minimize" onclick="minimizeWindow('cmdWindow')">
          <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>
        <button class="window-btn maximize" onclick="maximizeWindow('cmdWindow')">
          <svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"></rect></svg>
        </button>
        <button class="window-btn close" onclick="closeWindow('cmdWindow')">
          <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
    </div>
    <div class="window-content">
      <div class="terminal-body" id="terminalBody">
        <div class="terminal-welcome">欢迎使用NoTificiansCloudSimple CMD</div>
        <div class="terminal-input-line">
          <span class="terminal-prompt">&lt;NoTificiansCloud&gt;:</span>
          <input type="text" class="terminal-input" id="terminalInput" placeholder="" autofocus>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentPicInfo = { desc:'', author:'', link:'', picId:'', bgUrl:'' };
    const terminalBody = document.getElementById('terminalBody');
    const terminalInput = document.getElementById('terminalInput');
    const cmdWindow = document.getElementById('cmdWindow');
    const cmdHeader = document.getElementById('cmdHeader');

    var zCounter = 50;
    var initialContent = {};
    var variables = {};
    var lists = {};
    var dicts = {};
    var datLists = {};
    var domLists = {};
    var datDicts = {};
    var structs = {};
    var structInstances = {};
    var windowStructs = {};
    var windowTemplate = null;
    var windowIdCounter = 100;
    var openWindows = {};
    var evtFiles = {};
    var lawFiles = {};
    var contTypes = {};

    function focusWindow(id){
      var el = document.getElementById(id);
      if(el){
        zCounter++;
        el.style.zIndex = zCounter;
      }
    }

    function minimizeWindow(id){
      var el = document.getElementById(id);
      if(el){
        el.classList.remove('active');
      }
    }

    function maximizeWindow(id){
      var el = document.getElementById(id);
      if(el){
        el.classList.toggle('maximized');
      }
    }

    function closeWindow(id){
      var el = document.getElementById(id);
      if(!el) return;
      if(initialContent[id]){
        el.querySelector('.window-content').innerHTML = initialContent[id];
        el.classList.remove('maximized');
      }
      el.classList.remove('active');
    }

    initialContent['cmdWindow'] = document.querySelector('#cmdWindow .window-content').innerHTML;
    cmdWindow.addEventListener('mousedown', function(){
      focusWindow('cmdWindow');
    });

    var isDragging = false;
    var dragOffsetX = 0;
    var dragOffsetY = 0;

    cmdHeader.addEventListener('mousedown', function(e){
      if(cmdWindow.classList.contains('maximized')) return;
      isDragging = true;
      var rect = cmdWindow.getBoundingClientRect();
      dragOffsetX = e.clientX - rect.left;
      dragOffsetY = e.clientY - rect.top;
      cmdWindow.style.transition = 'none';
      e.preventDefault();
    });

    document.addEventListener('mousemove', function(e){
      if(!isDragging) return;
      var x = e.clientX - dragOffsetX;
      var y = e.clientY - dragOffsetY;
      cmdWindow.style.left = x + 'px';
      cmdWindow.style.top = y + 'px';
      cmdWindow.style.transform = 'none';
    });

    document.addEventListener('mouseup', function(){
      if(isDragging){
        isDragging = false;
        cmdWindow.style.transition = '';
      }
    });

    async function setBingBg(){
      const jsonUrl = "https://lightboxofficial.github.io/Bing-Wallpaper-Action/data/zh-CN_update.json";
      try{
        const resp = await fetch(jsonUrl);
        const data = await resp.json();
        if(data && data.images && data.images.length > 0){
          const img = data.images[0];
          const imgUrl = "https://cn.bing.com" + img.url;
          const copyright = img.copyright || '';
          const match = copyright.match(/^(.*?)\s*\(©\s*(.*?)\)$/);
          let desc, author;
          if(match){
            desc = match[1];
            author = match[2];
          }else{
            desc = copyright || '必应壁纸';
            author = '';
          }
          const preload = new Image();
          preload.onload = function(){
            document.body.style.backgroundImage = `url(${imgUrl})`;
            currentPicInfo.bgUrl = imgUrl;
            currentPicInfo.desc = desc;
            currentPicInfo.author = author;
            currentPicInfo.link = img.copyrightlink || '';
            currentPicInfo.picId = img.startdate || 'bing_' + Date.now();
          };
          preload.onerror = function(){
            loadFallback();
          };
          preload.src = imgUrl;
          return;
        }
      }catch(e){
        console.log("必应壁纸加载失败，降级picsum", e);
      }
      loadFallback();
    }

    function loadFallback(){
      const fallback = "https://picsum.photos/1920/1080?random=" + Date.now();
      document.body.style.backgroundImage = `url(${fallback})`;
      currentPicInfo.bgUrl = fallback;
      currentPicInfo.desc = "风景壁纸";
      currentPicInfo.author = "Picsum";
      currentPicInfo.picId = 'picsum_' + Date.now();
    }

    function getAllNames(){
      var names = [];
      Object.keys(variables).forEach(function(n){ names.push(n); });
      Object.keys(lists).forEach(function(n){ names.push(n); });
      Object.keys(dicts).forEach(function(n){ names.push(n); });
      Object.keys(datLists).forEach(function(n){ names.push(n); });
      Object.keys(domLists).forEach(function(n){ names.push(n); });
      Object.keys(datDicts).forEach(function(n){ names.push(n); });
      Object.keys(structs).forEach(function(n){ names.push(n); });
      Object.keys(structInstances).forEach(function(n){ names.push(n); });
      return names;
    }

    function isNameExists(name){
      return variables[name] !== undefined || lists[name] !== undefined || dicts[name] !== undefined || datLists[name] !== undefined || domLists[name] !== undefined || datDicts[name] !== undefined || structs[name] !== undefined || structInstances[name] !== undefined;
    }

    function resolveValue(text){
      // 解析结构体实例字段引用 instanceName.fieldName
      text = text.replace(/(\w+)\.(\w+)/g, function(match, instName, fieldName){
        if(structInstances[instName] && structInstances[instName].data[fieldName] !== undefined){
          return structInstances[instName].data[fieldName];
        }
        if(structs[instName] && structs[instName][fieldName] !== undefined){
          return structs[instName][fieldName];
        }
        return match;
      });
      // 解析字典引用 dictName(keyName) - 仅英文括号
      text = text.replace(/(\w+)\(([^)]+)\)/g, function(match, dictName, keyName){
        if(dicts[dictName] && dicts[dictName][keyName] !== undefined){
          return dicts[dictName][keyName];
        }
        return match;
      });
      // 解析多维列表引用 name[i,j,k...] - 仅英文括号和逗号
      text = text.replace(/(\w+)\[([\d,]+)\]/g, function(match, listName, indices){
        var idxArr = indices.split(',').map(Number);
        if(domLists[listName]){
          var val = domLists[listName];
          for(var i = 0; i < idxArr.length; i++){
            if(val && val[idxArr[i]] !== undefined){
              val = val[idxArr[i]];
            }else{
              return match;
            }
          }
          return Array.isArray(val) ? '[' + val.join(',') + ']' : val;
        }
        if(datLists[listName]){
          var val = datLists[listName];
          for(var i = 0; i < idxArr.length; i++){
            if(val && val[idxArr[i]] !== undefined){
              val = val[idxArr[i]];
            }else{
              return match;
            }
          }
          return Array.isArray(val) ? '{' + val.join(',') + '}' : val;
        }
        return match;
      });
      // 解析单层列表引用 name[index] - 仅英文括号
      text = text.replace(/(\w+)\[(\d+)\]/g, function(match, listName, index){
        if(lists[listName] && lists[listName][parseInt(index)] !== undefined){
          return lists[listName][parseInt(index)];
        }
        if(datLists[listName] && datLists[listName][parseInt(index)] !== undefined){
          var val = datLists[listName][parseInt(index)];
          return Array.isArray(val) ? '{' + val.join(',') + '}' : val;
        }
        return match;
      });
      // 解析变量引用
      Object.keys(variables).forEach(function(name){
        var regex = new RegExp('\\b' + name + '\\b', 'g');
        text = text.replace(regex, variables[name]);
      });
      return text;
    }

    function escapeHtml(text){
      var div = document.createElement('div');
      div.appendChild(document.createTextNode(text));
      return div.innerHTML;
    }

    function addOutput(text){
      const line = document.createElement('div');
      line.className = 'terminal-line';
      line.style.paddingLeft = '0';
      line.innerHTML = '<span class="terminal-output" style="margin-left:0">' + escapeHtml(text) + '</span>';
      const inputLine = terminalBody.querySelector('.terminal-input-line');
      terminalBody.insertBefore(line, inputLine);
      terminalBody.scrollTop = terminalBody.scrollHeight;
    }

    function processCommand(rawInput){
      var input = rawInput.trim();
      if(!input) return;

      // 解析尖括号内的文本内容
      function parseText(text){
        text = text.trim();
        if(text.startsWith('<') && text.endsWith('>')){
          return text.substring(1, text.length - 1);
        }
        // 检查是否是已定义的变量/列表/字典引用
        if(isNameExists(text)){
          return resolveValue(text);
        }
        // 检查是否是数字
        if(!isNaN(text) && text !== ''){
          return text;
        }
        // 未定义的标识符，返回错误
        return null;
      }

      // var 变量名 = <变量值>
      if(input.startsWith('var ')){
        var varMatch = input.match(/^var\s+(\w+)\s*=\s*(.+)$/);
        if(varMatch){
          var varName = varMatch[1];
          var varValue = parseText(varMatch[2].trim());
          if(varValue === null){
            addOutput('错误: 未定义的标识符 "' + varMatch[2].trim() + '"，文本内容请使用 <> 包裹');
          }else if(isNameExists(varName)){
            addOutput('该命名重复，请重新命名');
          }else{
            variables[varName] = varValue;
            addOutput('变量 ' + varName + ' 已设置');
          }
        }else{
          addOutput('语法错误: var 变量名 = <变量值>');
        }
        return;
      }

      // list 列表名 = {<内容1>, <内容2>, ...}
      if(input.startsWith('list ')){
        var listMatch = input.match(/^list\s+(\w+)\s*=\s*\{(.+)\}$/);
        if(listMatch){
          var listName = listMatch[1];
          if(isNameExists(listName)){
            addOutput('该命名重复，请重新命名');
          }else{
            var rawItems = listMatch[2].split(/,/);
            var items = [];
            var hasError = false;
            for(var i = 0; i < rawItems.length; i++){
              var item = parseText(rawItems[i].trim());
              if(item === null){
                addOutput('错误: 未定义的标识符 "' + rawItems[i].trim() + '"，文本内容请使用 <> 包裹');
                hasError = true;
                break;
              }
              items.push(item);
            }
            if(!hasError){
              lists[listName] = items;
              addOutput('列表 ' + listName + ' 已创建，共 ' + items.length + ' 项');
            }
          }
        }else{
          addOutput('语法错误: list 列表名 = {<内容1>, <内容2>, ...}');
        }
        return;
      }

      // dict 字典名 = [<键>:<值>, <键>:<值>, ...]
      if(input.startsWith('dict ')){
        var dictMatch = input.match(/^dict\s+(\w+)\s*=\s*\[(.+)\]$/);
        if(dictMatch){
          var dictName = dictMatch[1];
          if(isNameExists(dictName)){
            addOutput('该命名重复，请重新命名');
          }else{
            var pairs = dictMatch[2].split(/,/);
            var dictObj = {};
            var hasError = false;
            pairs.forEach(function(pair){
              var kv = pair.split(/:/);
              if(kv.length >= 2){
                var k = parseText(kv[0].trim());
                var v = parseText(kv.slice(1).join(':').trim());
                if(k === null || v === null){
                  addOutput('错误: 未定义的标识符，文本内容请使用 <> 包裹');
                  hasError = true;
                }else{
                  dictObj[k] = v;
                }
              }
            });
            if(!hasError){
              dicts[dictName] = dictObj;
              addOutput('字典 ' + dictName + ' 已创建，共 ' + Object.keys(dictObj).length + ' 项');
            }
          }
        }else{
          addOutput('语法错误: dict 字典名 = [<键>:<值>, <键>:<值>, ...]');
        }
        return;
      }

      // dat list 列表名 = {<项1>,<项2>,...} 支持单项和嵌套
      if(input.startsWith('dat list ')){
        var datMatch = input.match(/^dat\s+list\s+(\w+)\s*=\s*\{(.+)\}$/);
        if(datMatch){
          var datName = datMatch[1];
          if(isNameExists(datName)){
            addOutput('该命名重复，请重新命名');
          }else{
            var content = datMatch[2];
            var datItems = [];
            var depth = 0;
            var current = '';
            var error = false;
            for(var i = 0; i < content.length; i++){
              var ch = content[i];
              if(ch === '{'){
                depth++;
                if(depth === 1) continue;
                current += ch;
              }else if(ch === '}'){
                depth--;
                if(depth < 0){
                  error = true;
                  break;
                }
                if(depth === 0){
                  if(current.trim()){
                    var item = parseDatItem(current.trim());
                    if(item === null){
                      error = true;
                      break;
                    }
                    datItems.push(item);
                  }
                  current = '';
                }else{
                  current += ch;
                }
              }else if(ch === ',' && depth === 0){
                if(current.trim()){
                  var item = parseDatItem(current.trim());
                  if(item === null){
                    error = true;
                    break;
                  }
                  datItems.push(item);
                }
                current = '';
              }else if(depth >= 0){
                current += ch;
              }
            }
            if(error || depth !== 0){
              addOutput('语法错误: dat list 列表名 = {<项1>,<项2>,...}');
            }else{
              if(current.trim()){
                var item = parseDatItem(current.trim());
                if(item === null){
                  addOutput('错误: 未定义的标识符，文本内容请使用 <> 包裹');
                }else{
                  datItems.push(item);
                }
              }
              datLists[datName] = datItems;
              addOutput('dat列表 ' + datName + ' 已创建，共 ' + datItems.length + ' 项');
            }
          }
        }else{
          addOutput('语法错误: dat list 列表名 = {<项1>,<项2>,...}');
        }
        return;
      }

      function parseDatItem(text){
        text = text.trim();
        if(text.startsWith('{') && text.endsWith('}')){
          var inner = text.substring(1, text.length - 1);
          var items = inner.split(/,/);
          var result = [];
          for(var i = 0; i < items.length; i++){
            var item = parseText(items[i].trim());
            if(item === null) return null;
            result.push(item);
          }
          return result;
        }
        return parseText(text);
      }

      // dom list 列表名 = 多维数组格式
      if(input.startsWith('dom list ')){
        var domMatch = input.match(/^dom\s+list\s+(\w+)\s*=\s*(.+)$/);
        if(domMatch){
          var domName = domMatch[1];
          if(isNameExists(domName)){
            addOutput('该命名重复，请重新命名');
          }else{
            try{
              var domContent = domMatch[2].trim();
              var domData = JSON.parse(domContent);
              domLists[domName] = domData;
              addOutput('dom列表 ' + domName + ' 已创建');
            }catch(e){
              addOutput('语法错误: dom list 列表名 = 多维数组格式（仅英文符号）');
            }
          }
        }else{
          addOutput('语法错误: dom list 列表名 = 多维数组格式（仅英文符号）');
        }
        return;
      }

      // dat dict 字典名 = [<变量名>:<值>, <变量名>:<值>, ...]
      if(input.startsWith('dat dict ')){
        var datDictMatch = input.match(/^dat\s+dict\s+(\w+)\s*=\s*\[(.+)\]$/);
        if(datDictMatch){
          var datDictName = datDictMatch[1];
          if(isNameExists(datDictName)){
            addOutput('该命名重复，请重新命名');
          }else{
            var content = datDictMatch[2];
            var datDictData = {};
            var pairs = content.split(/,(?![^\[]*\])/);
            var error = false;
            for(var i = 0; i < pairs.length; i++){
              var pair = pairs[i].trim();
              var kvMatch = pair.match(/^(\w+)\s*:\s*(.+)$/);
              if(kvMatch){
                var key = kvMatch[1].trim();
                var val = parseText(kvMatch[2].trim());
                if(val === null){
                  addOutput('错误: 未定义的标识符，文本内容请使用 <> 包裹');
                  error = true;
                  break;
                }
                if(val.startsWith('{') && val.endsWith('}')){
                  var inner = val.substring(1, val.length - 1);
                  datDictData[key] = inner.split(/,/).map(function(s){ return s.trim(); });
                }else if(val.startsWith('[') && val.endsWith(']')){
                  var inner = val.substring(1, val.length - 1);
                  var subDict = {};
                  var subPairs = inner.split(/,(?![^\[]*\])/);
                  for(var j = 0; j < subPairs.length; j++){
                    var sp = subPairs[j].trim();
                    var skv = sp.match(/^([^:]+)\s*:\s*(.+)$/);
                    if(skv){
                      subDict[skv[1].trim()] = skv[2].trim();
                    }
                  }
                  datDictData[key] = subDict;
                }else{
                  datDictData[key] = val;
                }
              }
            }
            if(!error){
              datDicts[datDictName] = datDictData;
              addOutput('dat字典 ' + datDictName + ' 已创建');
            }
          }
        }else{
          addOutput('语法错误: dat dict 字典名 = [<变量名>:<值>, ...]');
        }
        return;
      }

      // struct 结构体名 = <var 字段名 = <值>, var 字段名 = <值>, ...>
      if(input.startsWith('struct ')){
        var structPrefix = input.match(/^struct\s+(\w+)\s*=\s*</);
        if(structPrefix){
          var structName = structPrefix[1];
          if(isNameExists(structName) || structInstances[structName]){
            addOutput('该命名重复，请重新命名');
          }else{
            var startIdx = input.indexOf('<', input.indexOf('='));
            var depth = 0;
            var endIdx = -1;
            for(var si = startIdx; si < input.length; si++){
              if(input[si] === '<') depth++;
              else if(input[si] === '>'){
                depth--;
                if(depth === 0){
                  endIdx = si;
                  break;
                }
              }
            }
            if(endIdx === -1){
              addOutput('语法错误: struct 结构体名 = <var 字段名 = <值>, ...>');
            }else{
              var content = input.substring(startIdx + 1, endIdx);
              var structData = {};
              var fields = splitStructFields(content);
              var error = false;
              for(var i = 0; i < fields.length; i++){
                var field = fields[i].trim();
                var varMatch = field.match(/^var\s+(\w+)\s*=\s*(.+)$/);
                if(varMatch){
                  var fieldName = varMatch[1].trim();
                  var fieldValue = parseText(varMatch[2].trim());
                  if(fieldValue === null){
                    addOutput('错误: 未定义的标识符，文本内容请使用 <> 包裹');
                    error = true;
                    break;
                  }
                  structData[fieldName] = fieldValue;
                }else{
                  addOutput('语法错误: struct 字段必须是 var 字段名 = <值> 格式');
                  error = true;
                  break;
                }
              }
              if(!error){
                structs[structName] = structData;
                addOutput('结构体类型 ' + structName + ' 已定义');
              }
            }
          }
        }else{
          addOutput('语法错误: struct 结构体名 = <var 字段名 = <值>, ...>');
        }
        return;
      }

      // 结构体类型 实例名  创建实例
      var structInstanceMatch = input.match(/^(\w+)\s+(\w+)$/);
      if(structInstanceMatch && !input.startsWith('var ') && !input.startsWith('list ') && !input.startsWith('dict ') && !input.startsWith('dat ') && !input.startsWith('dom ') && !input.startsWith('struct ') && !input.startsWith('window ') && !input.startsWith('read ') && !input.startsWith('write ') && !input.startsWith('help ') && !input.startsWith('clear')){
        var typeName = structInstanceMatch[1];
        var instanceName = structInstanceMatch[2];
        if(structs[typeName]){
          if(isNameExists(instanceName) || structInstances[instanceName]){
            addOutput('该命名重复，请重新命名');
          }else{
            var template = structs[typeName];
            var instanceData = {};
            Object.keys(template).forEach(function(k){
              instanceData[k] = template[k];
            });
            structInstances[instanceName] = { type: typeName, data: instanceData };
            addOutput('结构体实例 ' + instanceName + ' 已创建 (类型: ' + typeName + ')');
          }
        }
      }

      // 实例名.字段名 = <值>  修改实例字段
      var instanceFieldMatch = input.match(/^(\w+)\.(\w+)\s*=\s*(.+)$/);
      if(instanceFieldMatch && structInstances[instanceFieldMatch[1]]){
        var instName = instanceFieldMatch[1];
        var fieldName = instanceFieldMatch[2];
        var newValue = parseText(instanceFieldMatch[3].trim());
        if(newValue === null){
          addOutput('错误: 未定义的标识符，文本内容请使用 <> 包裹');
        }else if(structInstances[instName]){
          structInstances[instName].data[fieldName] = newValue;
          addOutput('结构体实例 ' + instName + '.' + fieldName + ' 已修改');
        }else{
          addOutput('未找到结构体实例: ' + instName);
        }
        return;
      }

      function splitStructFields(text){
        var fields = [];
        var current = '';
        var depth = 0;
        var i = 0;
        while(i < text.length){
          if(depth === 0 && text.substr(i, 4) === 'var ' && (i === 0 || text[i-1] === ',' || text[i-1] === ' ')){
            var trimmed = current.replace(/,\s*$/, '').trim();
            if(trimmed){
              fields.push(trimmed);
            }
            current = '';
            i += 4;
            continue;
          }
          var ch = text[i];
          if(ch === '{' || ch === '[' || ch === '(' || ch === '<') depth++;
          else if(ch === '}' || ch === ']' || ch === ')' || ch === '>') depth--;
          current += ch;
          i++;
        }
        var trimmed = current.replace(/,\s*$/, '').trim();
        if(trimmed){
          fields.push(trimmed);
        }
        return fields.map(function(f){
          return 'var ' + f;
        });
      }

      // write 修改数据 - 支持所有类型
      if(input.startsWith('write ')){
        var writeContent = input.substring(6).trim();
        
        // write 变量名 = <值>
        var writeVarMatch = writeContent.match(/^(\w+)\s*=\s*(.+)$/);
        if(writeVarMatch && variables[writeVarMatch[1]] !== undefined){
          var wVarName = writeVarMatch[1];
          var wVarValue = parseText(writeVarMatch[2].trim());
          if(wVarValue === null){
            addOutput('错误: 未定义的标识符，文本内容请使用 <> 包裹');
          }else{
            variables[wVarName] = wVarValue;
            addOutput('变量 ' + wVarName + ' 已修改');
          }
          return;
        }
        
        // write 列表名[索引] = <值>
        var writeListMatch = writeContent.match(/^(\w+)\[(\d+)\]\s*=\s*(.+)$/);
        if(writeListMatch){
          var wListName = writeListMatch[1];
          var wIndex = parseInt(writeListMatch[2]);
          var wValue = parseText(writeListMatch[3].trim());
          if(wValue === null){
            addOutput('错误: 未定义的标识符，文本内容请使用 <> 包裹');
          }else if(lists[wListName]){
            if(wIndex >= lists[wListName].length){
              lists[wListName].push(wValue);
              addOutput('列表 ' + wListName + ' 新增第 ' + wIndex + ' 项');
            }else{
              lists[wListName][wIndex] = wValue;
              addOutput('列表 ' + wListName + '[' + wIndex + '] 已修改');
            }
          }else if(datLists[wListName]){
            if(wIndex >= datLists[wListName].length){
              datLists[wListName].push(wValue);
              addOutput('dat列表 ' + wListName + ' 新增第 ' + wIndex + ' 项');
            }else{
              datLists[wListName][wIndex] = wValue;
              addOutput('dat列表 ' + wListName + '[' + wIndex + '] 已修改');
            }
          }else if(domLists[wListName]){
            if(wIndex >= domLists[wListName].length){
              domLists[wListName].push(wValue);
              addOutput('dom列表 ' + wListName + ' 新增第 ' + wIndex + ' 项');
            }else{
              domLists[wListName][wIndex] = wValue;
              addOutput('dom列表 ' + wListName + '[' + wIndex + '] 已修改');
            }
          }else{
            addOutput('未找到列表: ' + wListName);
          }
          return;
        }
        
        // write 字典名(<键>) = <值>
        var writeDictMatch = writeContent.match(/^(\w+)\(([^)]+)\)\s*=\s*(.+)$/);
        if(writeDictMatch){
          var wDictName = writeDictMatch[1];
          var wKey = writeDictMatch[2].trim();
          var wValue = parseText(writeDictMatch[3].trim());
          if(wValue === null){
            addOutput('错误: 未定义的标识符，文本内容请使用 <> 包裹');
          }else if(dicts[wDictName]){
            dicts[wDictName][wKey] = wValue;
            addOutput('字典 ' + wDictName + '(' + wKey + ') 已修改');
          }else if(datDicts[wDictName]){
            datDicts[wDictName][wKey] = wValue;
            addOutput('dat字典 ' + wDictName + '(' + wKey + ') 已修改');
          }else{
            addOutput('未找到字典: ' + wDictName);
          }
          return;
        }
        
        // write dat/dom列表名[索引1,索引2] = <值>
        var writeDatMatch = writeContent.match(/^(\w+)\[([\d,]+)\]\s*=\s*(.+)$/);
        if(writeDatMatch){
          var wDatName = writeDatMatch[1];
          var wIndices = writeDatMatch[2].split(',').map(Number);
          var wValue = parseText(writeDatMatch[3].trim());
          if(wValue === null){
            addOutput('错误: 未定义的标识符，文本内容请使用 <> 包裹');
          }else{
            var targetList = datLists[wDatName] || domLists[wDatName];
            if(targetList){
              if(wIndices.length === 1){
                var idx = wIndices[0];
                if(idx >= targetList.length){
                  targetList.push(wValue);
                  addOutput('列表 ' + wDatName + ' 新增第 ' + idx + ' 项');
                }else{
                  targetList[idx] = wValue;
                  addOutput('列表 ' + wDatName + '[' + idx + '] 已修改');
                }
              }else{
                var target = targetList;
                for(var i = 0; i < wIndices.length - 1; i++){
                  if(target[wIndices[i]] !== undefined){
                    target = target[wIndices[i]];
                  }else{
                    addOutput('索引越界');
                    return;
                  }
                }
                var lastIdx = wIndices[wIndices.length - 1];
                if(Array.isArray(target)){
                  if(lastIdx >= target.length){
                    target.push(wValue);
                    addOutput('列表 ' + wDatName + ' 新增项');
                  }else{
                    target[lastIdx] = wValue;
                    addOutput('列表 ' + wDatName + ' 已修改');
                  }
                }else{
                  addOutput('索引越界');
                }
              }
            }else{
              addOutput('未找到: ' + wDatName);
            }
          }
          return;
        }
        
        addOutput('语法错误: write 数据名 = <值> 或 write 数据名[索引] = <值> 或 write 数据名(键) = <值>');
        return;
      }

      // window 指令：从结构体实例创建窗口
      if(input.startsWith('window ')){
        var windowMatch = input.match(/^window\s+(\w+)$/);
        if(windowMatch){
          var instName = windowMatch[1];
          if(!structInstances[instName]){
            addOutput('未找到结构体实例: ' + instName);
          }else{
            var s = structInstances[instName].data;
            if(!s.name || !s.icon || !s.width || !s.height || !s.pos){
              addOutput('窗口结构体必须包含: name, icon, width, height, pos');
            }else{
              createWindowFromStruct(s);
            }
          }
        }else{
          addOutput('语法错误: window 结构体实例名');
        }
        return;
      }

      // cont 类型赋值: cont (<类型>) = start <文件名>
      var contMatch = input.match(/^cont\s*\((\w+)\)\s*=\s*start\s+(\w+\.\w+)$/);
      if(contMatch){
        var contType = contMatch[1];
        var evtName = contMatch[2];
        if(evtFiles[evtName]){
          contTypes[evtName] = { type: contType, content: evtFiles[evtName] };
          addOutput('内容类型 ' + evtName + ' 已设置为 ' + contType + ' 类型');
        }else{
          addOutput('未找到事件文件: ' + evtName);
        }
        return;
      }

      // start 指令：加载并执行指令集文件
      if(input.startsWith('start ')){
        var startMatch = input.match(/^start\s+(\S+)$/);
        if(startMatch){
          var fileName = startMatch[1];
          console.log('尝试加载: ' + fileName + ', lawFiles:', JSON.stringify(Object.keys(lawFiles)));
          if(lawFiles[fileName]){
            addOutput('=== 开始执行指令集: ' + fileName + ' ===');
            var lines = lawFiles[fileName].split('\n');
            var executed = 0;
            var execNext = function(){
              if(executed < lines.length){
                var line = lines[executed].trim();
                if(line && !line.startsWith('#')){
                  addOutput('[执行] ' + line);
                  processCommand(line);
                }
                executed++;
                setTimeout(execNext, 100);
              }else{
                addOutput('=== 指令集 ' + fileName + ' 执行完成 ===');
              }
            };
            execNext();
          }else{
            addOutput('未找到指令集文件: ' + fileName);
            addOutput('已加载的文件: ' + Object.keys(lawFiles).join(', ') || '无');
          }
        }else{
          addOutput('语法错误: start 文件名');
        }
        return;
      }

      function createWindowFromStruct(s){
        var winId = 'dynWindow_' + windowIdCounter++;
        var w = parseInt(s.width) || 600;
        var h = parseInt(s.height) || 400;
        var posStr = s.pos;
        var x = 50, y = 50;
        var posMatch = posStr.match(/[\{\[]?\s*(\d+)\s*,\s*(\d+)\s*[\}\]]?/);
        if(posMatch){
          x = parseInt(posMatch[1]);
          y = parseInt(posMatch[2]);
        }
        var hasMenu = s.menu !== undefined;

        var winEl = document.createElement('div');
        winEl.className = 'app-window';
        winEl.id = winId;
        winEl.style.left = x + 'px';
        winEl.style.top = y + 'px';
        winEl.style.width = w + 'px';
        winEl.style.height = h + 'px';
        winEl.style.transform = 'scale(0.85)';

        var headerHTML = '<div class="window-header" id="' + winId + '_header">' +
          '<div class="window-header-left">' +
            '<div class="window-header-logo" data-sidebar-toggle="' + winId + '">' +
              '<svg viewBox="0 0 24 24">' +
                '<polyline points="4 17 10 11 4 5"></polyline>' +
                '<line x1="12" y1="19" x2="20" y2="19"></line>' +
              '</svg>' +
            '</div>' +
            '<div class="window-title">' + s.name + '</div>' +
          '</div>' +
          '<div class="window-controls">' +
            '<button class="window-btn minimize" onclick="minimizeWindow(\'' + winId + '\')"><svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"></line></svg></button>' +
            '<button class="window-btn maximize" onclick="maximizeWindow(\'' + winId + '\')"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"></rect></svg></button>' +
            '<button class="window-btn close" onclick="closeWindow(\'' + winId + '\')"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>' +
          '</div>' +
        '</div>';

        var contentHTML = '';
        if(hasMenu){
          var menuItems = parseMenuItems(s.menu);
          var sidebarItemsHTML = '';
          menuItems.forEach(function(item, idx){
            sidebarItemsHTML += '<div class="window-sidebar-item' + (idx === 0 ? ' active' : '') + '" data-idx="' + idx + '">' +
              '<span style="flex-shrink:0;">' + item.icon + '</span>' +
              '<span>' + item.name + '</span>' +
            '</div>';
          });
          
          contentHTML = '<div class="window-body">' +
            '<div class="window-sidebar" id="' + winId + '_sidebar">' +
              '<div class="window-sidebar-header"><h3>' + s.name + '</h3></div>' +
              '<div class="window-sidebar-nav">' + sidebarItemsHTML + '</div>' +
            '</div>' +
            '<div class="window-sidebar-overlay" id="' + winId + '_overlay"></div>' +
            '<div class="window-content" style="padding:0;">' +
              '<div style="height:100%;position:relative;" class="window-iframe-container">' +
                '<iframe style="width:100%;height:100%;border:none;background:transparent;" srcdoc="<html><body style=\'margin:0;padding:16px;color:#fff;font-family:sans-serif;\'>选择一个菜单项</body></html>"></iframe>' +
              '</div>' +
            '</div>' +
          '</div>';
        }else{
          contentHTML = '<div class="window-content" style="padding:16px;">' +
            '<div style="height:100%;position:relative;" class="window-iframe-container">' +
              '<iframe style="width:100%;height:100%;border:none;background:transparent;" srcdoc="<html><body style=\'margin:0;padding:16px;color:#fff;font-family:sans-serif;\'>窗口内容</body></html>"></iframe>' +
            '</div>' +
          '</div>';
        }

        winEl.innerHTML = headerHTML + contentHTML;
        document.body.appendChild(winEl);

        initialContent[winId] = winEl.querySelector('.window-content').innerHTML;

        winEl.addEventListener('mousedown', function(){
          focusWindow(winId);
        });

        var hdr = document.getElementById(winId + '_header');
        setupDrag(winEl, hdr);

        // 侧边栏切换
        var logoToggle = winEl.querySelector('[data-sidebar-toggle]');
        if(logoToggle){
          logoToggle.addEventListener('click', function(e){
            e.stopPropagation();
            var sidebar = winEl.querySelector('.window-sidebar');
            var overlay = winEl.querySelector('.window-sidebar-overlay');
            if(sidebar && overlay){
              var isOpen = sidebar.classList.contains('open');
              if(isOpen){
                sidebar.classList.remove('open');
                overlay.classList.remove('show');
              } else {
                sidebar.classList.add('open');
                overlay.classList.add('show');
              }
            }
          });
        }

        // 覆盖层点击关闭
        var overlay = winEl.querySelector('.window-sidebar-overlay');
        if(overlay){
          overlay.addEventListener('click', function(){
            var sidebar = winEl.querySelector('.window-sidebar');
            if(sidebar){
              sidebar.classList.remove('open');
              overlay.classList.remove('show');
            }
          });
        }

        // 侧边栏项点击
        var sidebarItems = winEl.querySelectorAll('.window-sidebar-item');
        sidebarItems.forEach(function(item){
          item.addEventListener('click', function(){
            var sidebar = item.closest('.window-sidebar');
            if(sidebar){
              sidebar.querySelectorAll('.window-sidebar-item').forEach(function(i){
                i.classList.remove('active');
              });
              item.classList.add('active');
              sidebar.classList.remove('open');
              var overlay = sidebar.parentElement.querySelector('.window-sidebar-overlay');
              if(overlay) overlay.classList.remove('show');
            }
          });
        });

        if(hasMenu){
          bindMenuClicks(winId, s.menu);
        }

        setTimeout(function(){
          winEl.classList.add('active');
          focusWindow(winId);
        }, 50);

        addOutput('窗口 "' + s.name + '" 已打开');
      }

      function buildMenuItems(menuStr){
        var items = parseMenuItems(menuStr);
        var html = '';
        items.forEach(function(item, idx){
          html += '<div class="menu-item" data-idx="' + idx + '" style="padding:8px;margin:4px 0;border-radius:6px;cursor:pointer;transition:background 0.2s;display:flex;align-items:center;gap:6px;font-size:12px;color:rgba(255,255,255,0.8);">' +
            '<span class="menu-icon" style="flex-shrink:0;">' + item.icon + '</span>' +
            '<span>' + item.name + '</span>' +
          '</div>';
        });
        return html;
      }

      function parseMenuItems(menuStr){
        var items = [];
        var depth = 0;
        var current = '';
        for(var i = 0; i < menuStr.length; i++){
          var ch = menuStr[i];
          if(ch === '{'){
            depth++;
            if(depth === 1){ current = ''; continue; }
          }else if(ch === '}'){
            depth--;
            if(depth === 0){
              items.push(parseMenuItem(current.trim()));
              current = '';
              continue;
            }
          }else if(ch === ',' && depth === 0){
            continue;
          }
          current += ch;
        }
        return items;
      }

      function parseMenuItem(text){
        // 解析菜单项：名称,图标(SVG),HTML内容
        // SVG 可能包含 <svg>...</svg> 和逗号，需要特殊处理
        var parts = [];
        var depth = 0;
        var current = '';
        for(var i = 0; i < text.length; i++){
          var ch = text[i];
          if(ch === '<') depth++;
          else if(ch === '>') depth--;
          if(ch === ',' && depth === 0){
            parts.push(current.trim());
            current = '';
          }else{
            current += ch;
          }
        }
        if(current) parts.push(current.trim());
        
        // 至少需要名称
        return {
          name: parts[0] || '未命名',
          icon: parts[1] || '',
          html: parts.slice(2).join(',') || '<p>无内容</p>'
        };
      }

      function bindMenuClicks(winId, menuStr){
        var winEl = document.getElementById(winId);
        if(!winEl) return;
        var menuItems = winEl.querySelectorAll('.menu-item');
        var items = parseMenuItems(menuStr);

        menuItems.forEach(function(el, idx){
          el.addEventListener('click', function(){
            menuItems.forEach(function(m){ m.style.background = 'transparent'; });
            el.style.background = 'rgba(255,255,255,0.08)';
            var item = items[idx];
            var htmlContent = item.html || '<p>无内容</p>';
            var iframeContainer = winEl.querySelector('.window-iframe-container');
            if(iframeContainer){
              var iframe = iframeContainer.querySelector('iframe');
              if(iframe){
                iframe.srcdoc = '<html><head><style>body{margin:0;padding:16px;color:rgba(255,255,255,0.9);font-family:-apple-system,sans-serif;}</style></head><body>' + htmlContent + '</body></html>';
              }
            }
          });
          el.addEventListener('mouseenter', function(){
            if(el.style.background !== 'rgba(255,255,255,0.08)'){
              el.style.background = 'rgba(255,255,255,0.04)';
            }
          });
          el.addEventListener('mouseleave', function(){
            if(el.style.background !== 'rgba(255,255,255,0.08)'){
              el.style.background = 'transparent';
            }
          });
        });
      }

      function setupDrag(winEl, header){
        var isDragging = false;
        var dragOffsetX = 0;
        var dragOffsetY = 0;

        header.addEventListener('mousedown', function(e){
          if(winEl.classList.contains('maximized')) return;
          isDragging = true;
          var rect = winEl.getBoundingClientRect();
          dragOffsetX = e.clientX - rect.left;
          dragOffsetY = e.clientY - rect.top;
          winEl.style.transition = 'none';
          e.preventDefault();
        });

        document.addEventListener('mousemove', function(e){
          if(!isDragging) return;
          var x = e.clientX - dragOffsetX;
          var y = e.clientY - dragOffsetY;
          winEl.style.left = x + 'px';
          winEl.style.top = y + 'px';
          winEl.style.transform = 'none';
        });

        document.addEventListener('mouseup', function(){
          if(isDragging){
            isDragging = false;
            winEl.style.transition = '';
          }
        });
      }

      // help [指令名]
      if(input === 'help' || input.startsWith('help ')){
        var cmdName = input.substring(5).trim();
        if(!cmdName){
          addOutput('=== NoTificiansCloud 指令列表 ===');
          addOutput('var <名> = <值>           设置变量');
          addOutput('list <名> = {项...}       创建列表');
          addOutput('dict <名> = [键:值...]    创建字典');
          addOutput('dat list <名> = {项...}   创建嵌套列表');
          addOutput('dom list <名> = [...]     创建多维列表');
          addOutput('dat dict <名> = [键:值...] 创建繁杂字典');
          addOutput('struct <名> = <var...>    定义结构体类型');
          addOutput('<类型> <实例名>           创建结构体实例');
          addOutput('<实例>.<字段> = <值>      修改实例字段');
          addOutput('window <实例名>           从实例创建窗口');
          addOutput('cont (<类型>) = start <文件名>  设置内容类型');
          addOutput('start <文件名>            执行指令集文件');
          addOutput('read <名/索引/键>         查看数据');
          addOutput('write <名[索引]> = <值>   修改数据');
          addOutput('help [指令名]             查看帮助');
          addOutput('clear                     清屏');
          addOutput('输入任意内容              回显（支持引用）');
        }else{
          var helpTexts = {
            'var': 'var 变量名 = 变量值\n设置一个变量，值可以是任何类型的连续内容\n示例: var name = 张三\n引用: 直接使用变量名，如 "你好 name"',
            'list': 'list 列表名 = {内容1, 内容2, ...}\n创建一个列表，项之间用英文逗号分隔\n示例: list colors = {红, 绿, 蓝}\n引用: 列表名[索引]，如 colors[0]\n注意: 仅英文符号识别为表达式',
            'dict': 'dict 字典名 = [键:值, 键:值, ...]\n创建键值对字典，用中括号包裹\n示例: dict info = [姓名:张三, 年龄:20]\n引用: 字典名(键名)，如 info(姓名)\n注意: 仅英文符号识别为表达式',
            'dat': 'dat list 列表名 = {项1,项2,...}\n创建嵌套列表，支持单项和嵌套混合\n示例: dat list name = {1,{1,3},{1,3,5},5,4,1,{1,2,3}}\n引用: 列表名[索引] 读取单项，列表名[索引1,索引2] 读取嵌套项\n如 name[2,2] 读取 {1,3,5} 中的 5\n注意: 英文符号优先识别为表达式，中文符号为普通字符，嵌套出错会报错',
            'dom': 'dom list 列表名 = 多维数组格式\n创建多维列表，语法类似C++多维数组\n示例: dom list arr = [[[1,2],[3,4]],[[5,6],[7,8]]]\n引用: 列表名[索引1,索引2,...]\n注意: 仅英文符号识别为表达式',
            'dat dict': 'dat dict 字典名 = [变量名:值, ...]\n创建繁杂字典，键必须是已定义的变量名，值可以是列表或字典\n示例: var a = 1\n      dat dict info = [a:{1,2,3}, b:[x:10]]\n引用: read info',
            'struct': 'struct 结构体名 = <var 字段名 = 值, ...>\n定义结构体类型（类似C++ struct定义）\n示例: struct mywin = <var name = 窗口, var icon = <svg>...</svg>, var width = 600, var height = 400, var pos = {100,100}>\n\n创建实例: mywin win1\n修改字段: win1.name = 新窗口\n读取字段: read win1.name',
            'window': 'window 结构体实例名\n从结构体实例创建窗口\n实例必须包含: name(名称), icon(SVG图标), width(宽度), height(高度), pos({x坐标,y坐标})\n可选: menu(侧边栏繁杂列表，每项{名称,SVG图标,HTML内容})\n示例: mywin win1\n      win1.name = 我的窗口\n      win1.width = 800\n      window win1',
            'cont': 'cont (类型) = start 文件名\n将事件文件内容设置为指定类型\n示例: cont (html) = start terminal.evt\n类型可以是: html, text, code 等',
            'start': 'start 文件名\n加载并执行指令集文件(.law)\n文件中的每一行都是一条独立指令\n示例: start testwindow.law\n执行过程会在终端中完整显示',
            'read': 'read 变量名              查看变量值\nread 列表名              查看整个列表\nread 列表名[索引]        查看列表某一项\nread 字典名              查看整个字典\nread 字典名(键名)        查看字典某键的值\nread 列表名[索引1,索引2] 查看嵌套列表某项\nread 结构体实例.字段名    查看结构体实例字段',
            'write': 'write 列表名[索引] = 值      修改列表项（不存在则新建）\nwrite 字典名(键) = 值        修改字典键值\nwrite 列表名[索引1,索引2] = 值  修改嵌套列表项',
            'help': 'help               查看所有指令列表\nhelp 指令名        查看指定指令的详细用法\n示例: help var\n      help list',
            'clear': 'clear              清空终端屏幕\n无参数'
          };
          if(helpTexts[cmdName]){
            addOutput(helpTexts[cmdName]);
          }else{
            addOutput('未找到指令: ' + cmdName);
          }
        }
        return;
      }

      // clear 清屏
      if(input === 'clear'){
        var lines = terminalBody.querySelectorAll('.terminal-line');
        lines.forEach(function(line){ line.remove(); });
        return;
      }

      // read 数据
      if(input.startsWith('read ')){
        var name = input.substring(5).trim();
        // 结构体实例字段引用 name.field
        var structReadMatch = name.match(/^(\w+)\.(\w+)$/);
        if(structReadMatch){
          var sName = structReadMatch[1];
          var sField = structReadMatch[2];
          if(structInstances[sName] && structInstances[sName].data[sField] !== undefined){
            addOutput(structInstances[sName].data[sField]);
          }else if(structs[sName] && structs[sName][sField] !== undefined){
            addOutput(structs[sName][sField]);
          }else{
            addOutput('未找到: ' + name);
          }
          return;
        }
        // 字典引用 name(key)
        var dictReadMatch = name.match(/^(\w+)\(([^)]+)\)$/);
        if(dictReadMatch){
          var dName = dictReadMatch[1];
          var dKey = dictReadMatch[2].trim();
          if(dicts[dName] && dicts[dName][dKey] !== undefined){
            addOutput(dicts[dName][dKey]);
          }else{
            addOutput('未找到: ' + name);
          }
          return;
        }
        // 多维索引 name[i,j,k...]
        var multiMatch = name.match(/^(\w+)\[([\d,]+)\]$/);
        if(multiMatch){
          var mName = multiMatch[1];
          var mIndices = multiMatch[2].split(',').map(Number);
          if(domLists[mName]){
            var val = domLists[mName];
            for(var i = 0; i < mIndices.length; i++){
              if(val && val[mIndices[i]] !== undefined){
                val = val[mIndices[i]];
              }else{
                addOutput('未找到: ' + name);
                return;
              }
            }
            addOutput(Array.isArray(val) ? '[' + val.join(',') + ']' : val);
            return;
          }
          if(datLists[mName]){
            var val = datLists[mName];
            for(var i = 0; i < mIndices.length; i++){
              if(val && val[mIndices[i]] !== undefined){
                val = val[mIndices[i]];
              }else{
                addOutput('未找到: ' + name);
                return;
              }
            }
            addOutput(Array.isArray(val) ? '{' + val.join(',') + '}' : val);
            return;
          }
        }
        // 单层列表索引 name[index]
        var listMatch = name.match(/^(\w+)\[(\d+)\]$/);
        if(listMatch){
          var lName = listMatch[1];
          var lIndex = parseInt(listMatch[2]);
          if(lists[lName] && lists[lName][lIndex] !== undefined){
            addOutput(lists[lName][lIndex]);
          }else if(datLists[lName] && datLists[lName][lIndex] !== undefined){
            var val = datLists[lName][lIndex];
            addOutput(Array.isArray(val) ? '{' + val.join(',') + '}' : val);
          }else{
            addOutput('未找到: ' + name);
          }
          return;
        }
        // 直接读取
        if(variables[name] !== undefined){
          addOutput(variables[name]);
        }else if(lists[name]){
          addOutput('[' + lists[name].join(', ') + ']');
        }else if(dicts[name]){
          var dictStrs = [];
          Object.keys(dicts[name]).forEach(function(k){
            dictStrs.push(k + ':' + dicts[name][k]);
          });
          addOutput('[' + dictStrs.join(', ') + ']');
        }else if(datLists[name]){
          addOutput(JSON.stringify(datLists[name]));
        }else if(domLists[name]){
          addOutput(JSON.stringify(domLists[name]));
        }else if(datDicts[name]){
          var ddStrs = [];
          Object.keys(datDicts[name]).forEach(function(k){
            var v = datDicts[name][k];
            ddStrs.push(k + ':' + (Array.isArray(v) ? '{' + v.join(',') + '}' : (typeof v === 'object' ? JSON.stringify(v) : v)));
          });
          addOutput('[' + ddStrs.join(', ') + ']');
        }else if(structs[name]){
          var stStrs = [];
          Object.keys(structs[name]).forEach(function(k){
            stStrs.push(k + '=' + structs[name][k]);
          });
          addOutput('<' + stStrs.join(', ') + '>');
        }else if(structInstances[name]){
          var siStrs = [];
          Object.keys(structInstances[name].data).forEach(function(k){
            siStrs.push(k + '=' + structInstances[name].data[k]);
          });
          addOutput('[' + structInstances[name].type + '] <' + siStrs.join(', ') + '>');
        }else{
          addOutput('未找到: ' + name);
        }
        return;
      }

      // 默认回显（解析变量和列表引用）
      var resolved = resolveValue(input);
      addOutput(resolved);
    }

    terminalInput.addEventListener('keydown', function(e){
      if(e.key === 'Enter'){
        e.preventDefault();
        const val = terminalInput.value.trim();
        if(val){
          // 先显示输入行（带提示符）
          const inputLine = document.createElement('div');
          inputLine.className = 'terminal-line';
          inputLine.innerHTML = '<span class="terminal-prompt">&lt;NoTificiansCloud&gt;:</span><span class="terminal-output"> ' + val + '</span>';
          const currentInputLine = terminalBody.querySelector('.terminal-input-line');
          terminalBody.insertBefore(inputLine, currentInputLine);
          // 处理命令
          processCommand(val);
          terminalInput.value = '';
        }
      }
    });

    terminalBody.addEventListener('click', function(){
      terminalInput.focus();
    });

    async function loadResourceFiles(){
      try{
        console.log('开始加载 files.md...');
        var resp = await fetch('files.txt');
        console.log('fetch 响应状态:', resp.status);
        if(resp.ok){
          var text = await resp.text();
          console.log('files.md 内容前100字符:', text.substring(0, 100));
          parseFileSystem(text);
          console.log('解析完成, evtFiles:', Object.keys(evtFiles));
          console.log('解析完成, lawFiles:', Object.keys(lawFiles));
        }else{
          console.log('fetch 失败，状态码:', resp.status);
        }
      }catch(e){
        console.log('加载 files.md 异常: ' + e);
      }
    }

    function parseFileSystem(text){
      var lines = text.split('\n');
      var currentFile = null;
      var currentContent = [];
      for(var i = 0; i < lines.length; i++){
        var line = lines[i];
        var fileMatch = line.match(/^<([a-zA-Z0-9_]+\.[a-zA-Z]+)>$/);
        if(fileMatch){
          if(currentFile){
            saveFile(currentFile, currentContent.join('\n'));
          }
          currentFile = fileMatch[1];
          currentContent = [];
        }else if(currentFile){
          var closeMatch = line.match(/^<\/([a-zA-Z0-9_]+\.[a-zA-Z]+)>$/);
          if(closeMatch && closeMatch[1] === currentFile){
            saveFile(currentFile, currentContent.join('\n'));
            currentFile = null;
            currentContent = [];
          }else{
            currentContent.push(line);
          }
        }
      }
      if(currentFile){
        saveFile(currentFile, currentContent.join('\n'));
      }
    }

    function saveFile(fname, content){
      content = content.trim();
      if(fname.endsWith('.evt')){
        evtFiles[fname] = content;
      }else if(fname.endsWith('.law')){
        lawFiles[fname] = content;
      }
    }

    window.addEventListener('load', function(){
      setBingBg();
      loadResourceFiles();
      
      // 侧边栏切换
      var sidebarToggles = document.querySelectorAll('[data-sidebar-toggle]');
      sidebarToggles.forEach(function(toggle){
        toggle.addEventListener('click',function(e){
          e.stopPropagation();
          var winId = toggle.getAttribute('data-sidebar-toggle');
          var sidebar = document.getElementById(winId.replace('Window','') + 'Sidebar');
          var overlay = document.getElementById(winId.replace('Window','') + 'SidebarOverlay');
          if(sidebar && overlay){
            var isOpen = sidebar.classList.contains('open');
            if(isOpen){
              sidebar.classList.remove('open');
              overlay.classList.remove('show');
            } else {
              sidebar.classList.add('open');
              overlay.classList.add('show');
            }
          }
        });
      });

      // 覆盖层点击关闭
      var overlays = document.querySelectorAll('.window-sidebar-overlay');
      overlays.forEach(function(overlay){
        overlay.addEventListener('click',function(){
          var sidebar = overlay.parentElement.querySelector('.window-sidebar');
          if(sidebar){
            sidebar.classList.remove('open');
            overlay.classList.remove('show');
          }
        });
      });

      // 侧边栏项点击
      var sidebarItems = document.querySelectorAll('.window-sidebar-item');
      sidebarItems.forEach(function(item){
        item.addEventListener('click',function(){
          var sidebar = item.closest('.window-sidebar');
          if(sidebar){
            sidebar.querySelectorAll('.window-sidebar-item').forEach(function(i){
              i.classList.remove('active');
            });
            item.classList.add('active');
            sidebar.classList.remove('open');
            var overlay = sidebar.parentElement.querySelector('.window-sidebar-overlay');
            if(overlay) overlay.classList.remove('show');
          }
        });
      });

      setTimeout(function(){
        cmdWindow.classList.add('active');
        terminalInput.focus();
      }, 300);
    });
  </script>
