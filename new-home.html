<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新首页测试版</title>
  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }
    body{
      min-height:100vh;
      background:#111;
      background-size:cover;
      background-position:center;
      background-repeat:no-repeat;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      overflow:hidden;
      transition:background-image 0.5s ease;
    }
    .dock-wrapper{
      position:fixed;
      left:50%;
      bottom:12px;
      transform:translateX(-50%);
      display:flex;
      align-items:center;
      gap:8px;
      z-index:100;
    }
    .dock-toggle{
      width:36px;
      height:36px;
      border-radius:50%;
      background:rgba(12,12,16,0.7);
      backdrop-filter:blur(24px) saturate(140%);
      -webkit-backdrop-filter:blur(24px) saturate(140%);
      border:1px solid rgba(255,255,255,0.03);
      box-shadow:0 6px 18px rgba(0,0,0,0.55);
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      transition:background 0.2s, transform 0.15s;
      flex-shrink:0;
    }
    .dock-toggle:hover{
      background:rgba(18,18,24,0.8);
    }
    .dock-toggle:active{
      transform:scale(0.9);
    }
    .dock-toggle svg{
      width:16px;
      height:16px;
      stroke:#fff;
      stroke-width:1.5;
      fill:none;
      stroke-linecap:round;
      stroke-linejoin:round;
      transition:transform 0.3s ease;
    }
    .dock-toggle.collapsed svg{
      transform:rotate(180deg);
    }
    .dock{
      height:32px;
      border-radius:16px;
      background:rgba(12,12,16,0.65);
      backdrop-filter:blur(24px) saturate(140%);
      -webkit-backdrop-filter:blur(24px) saturate(140%);
      border:1px solid rgba(255,255,255,0.03);
      box-shadow:0 6px 18px rgba(0,0,0,0.5);
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      padding:0 12px;
      overflow:hidden;
      width:0;
      opacity:0;
      transition:width 0.3s ease, opacity 0.25s ease, padding 0.3s ease;
    }
    .dock.expanded{
      width:min(70vw,800px);
      opacity:1;
      padding:0 16px;
    }
  </style>
</head>
<body>
  <div class="dock-wrapper">
    <div class="dock-toggle" id="dockToggle">
      <svg viewBox="0 0 24 24">
        <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
        <path d="M2 17l10 5 10-5"></path>
        <path d="M2 12l10 5 10-5"></path>
      </svg>
    </div>
    <div class="dock" id="dock"></div>
  </div>
  <script>
    async function loadBingWallpaper(){
      const jsonUrl = "https://lightboxofficial.github.io/Bing-Wallpaper-Action/data/zh-CN_update.json";
      try{
        const resp = await fetch(jsonUrl);
        const data = await resp.json();
        if(data && data.images && data.images.length > 0){
          const img = data.images[0];
          const imgUrl = "https://cn.bing.com" + img.url;
          const preload = new Image();
          preload.onload = function(){
            document.body.style.backgroundImage = `url(${imgUrl})`;
          };
          preload.src = imgUrl;
          return;
        }
      }catch(e){
        console.log('壁纸加载失败，使用默认背景');
      }
      document.body.style.background = '#111';
    }
    loadBingWallpaper();

    var dockToggle = document.getElementById('dockToggle');
    var dock = document.getElementById('dock');
    var isExpanded = false;
    dockToggle.addEventListener('click', function(){
      isExpanded = !isExpanded;
      dock.classList.toggle('expanded', isExpanded);
      dockToggle.classList.toggle('collapsed', !isExpanded);
    });
  </script>
</body>
</html>
