<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mobile‑Test‑Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #e5e7eb;
            min-height: 100vh;
            background-color: #050608;
            background-image: url("/bg-cover.jpg");
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.55), rgba(0,0,0,0.72));
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1380px;
            margin: 0 auto;
            padding: 60px 24px;
        }

        .hero {
            text-align: center;
            margin-bottom: 36px;
        }

        .hero h1 {
            font-size: 2.7rem;
            color: #f5f7fa;
            margin-bottom: 12px;
        }

        .hero .subtitle {
            font-size: 1.2rem;
            color: #9aa0ac;
        }

        .card-list {
            display: flex;
            flex-direction: column;
            gap: 21px;
        }

        /* 放大后的自我介绍主卡片，原尺寸1.5倍 */
        .card {
            position: relative;
            backdrop-filter: blur(12px);
            background-color: rgba(18,20,24,0.48);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 21px;
            padding: 21px 24px;
            height: 144px;
        }

        .profile-big-card {
            display: flex;
            gap: 21px;
            align-items: stretch;
            height: 100%;
        }

        .avatar-group {
            display: flex;
            gap: 9px;
            flex-shrink: 0;
        }

        /* 头像放大 */
        .avatar-item {
            width: 135px;
            height: 135px;
            border-radius: 18px;
            overflow: hidden;
            background-color: #111111;
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
        }

        .avatar-item.avatar-1 {
            background-image: url("/avatar1.jpg");
        }

        .avatar-item.avatar-2 {
            background-image: url("/avatar2.jpg");
        }

        .btn-group-col {
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            height: 105px;
            justify-content: space-between;
        }

        /* 按钮放大 */
        .btn-solid-white {
            isolation: isolate;
            padding: 0 18px;
            line-height: 46px;
            background: #ffffff !important;
            color: #000000 !important;
            border: none;
            border-radius: 9px;
            font-size: 1.2rem;
            text-align: center;
            cursor: pointer;
            user-select: none;
        }

        .btn-solid-white:active {
            background: #ececec !important;
        }

        .btn-outline-white {
            isolation: isolate;
            padding: 0 18px;
            line-height: 46px;
            background: transparent !important;
            color: #ffffff !important;
            border: 1px solid rgba(255,255,255,0.8);
            border-radius: 9px;
            font-size: 1.2rem;
            text-align: center;
            cursor: pointer;
            user-select: none;
        }

        .btn-outline-white:active {
            background: rgba(255,255,255,0.07) !important;
        }

        /* 描述文案放大，隐藏滚动条 */
        .profile-desc {
            flex: 1;
            height: 105px;
            color: #cfd3da;
            line-height: 1.55;
            font-size: 1.1rem;
            overflow-y: auto;
            padding-right: 8px;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .profile-desc::-webkit-scrollbar {
            display: none;
        }

        footer {
            margin-top: 80px;
            text-align: center;
            color: #6b7280;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="hero">
        <h1>NoTificians</h1>
        <p class="subtitle">手机本地测试版本</p>
    </div>

    <div class="card-list">
        <!-- 仅保留自我介绍头像卡片，内容完全不变 -->
        <div class="card profile-big-card">
            <div class="avatar-group">
                <div class="avatar-item avatar-1"></div>
                <div class="avatar-item avatar-2"></div>
            </div>

            <div class="btn-group-col">
                <div class="btn-solid-white">测试+</div>
                <div class="btn-outline-white">测试文本</div>
            </div>

            <div class="profile-desc">
                回退版本：保留磨砂玻璃完整效果。华为content://本地打开按钮会变暗，WPS、电脑浏览器打开全部测试正常。
            </div>
        </div>
    </div>

    <footer>© 2026 Test Mobile</footer>
</div>
</body>
</html>
