<html lang="zh-CN">
<head>

<title>NoTificians无闻小站-求索既无止，何处是归途</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  width:100%;
  height:100%;
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  background-attachment:fixed;
  padding-bottom: 80px;
  font-family: system-ui, sans-serif;
}
.island{
  position:fixed;
  bottom:20px;
  background:rgba(0,0,0,0.45);
  backdrop-filter: blur(10px);
  border-radius: 8px;
  height: 45px;
  padding: 0 12px;
  box-sizing: border-box;
  display:flex;
  align-items:center;
  gap:8px;
  color:#fff;
}
.island-main{
  left:50%;
  transform:translateX(-50%);
  width: 500px;
  justify-content: center;
}
.island-left{
  left: 20px;
  width:250px;
  justify-content:flex-start;
  padding-left:16px;
}
.island-right{
  right: 20px;
  width:250px;
  justify-content:flex-end;
  padding-right:16px;
}
.icon-btn{
  width:auto;
  height:auto;
  border-radius:0;
  border:none;
  background:transparent;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:6px;
  transition:opacity 0.2s, transform 0.15s;
  flex-shrink:0;
}
.icon-btn:hover{
  opacity:0.7;
}
.icon-btn:active{
  transform:scale(0.92);
}
.icon-btn svg{
  width:20px;
  height:20px;
  stroke:rgba(255,255,255,0.75);
}
.info-popup{
  position:fixed;
  left:36px;
  bottom:80px;
  width:280px;
  background:rgba(0,0,0,0.65);
  backdrop-filter: blur(14px);
  border-radius:14px;
  padding:16px;
  color:#fff;
  box-shadow:0 8px 32px rgba(0,0,0,0.35);
  z-index:999;
  opacity:0;
  transform:scale(0.85) translateY(10px);
  transform-origin:bottom left;
  transition:opacity 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
              transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  pointer-events:none;
}
.info-popup.show{
  opacity:1;
  transform:scale(1) translateY(0);
  pointer-events:auto;
}
.info-popup-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
  font-size:15px;
  font-weight:600;
}
.info-popup .close-btn{
  width:24px;
  height:24px;
  border-radius:50%;
  border:none;
  background:rgba(255,255,255,0.18);
  color:#fff;
  cursor:pointer;
  font-size:13px;
  line-height:1;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:background 0.2s;
}
.info-popup .close-btn:hover{
  background:rgba(255,255,255,0.35);
}
.info-item{
  margin-bottom:10px;
}
.info-item:last-child{
  margin-bottom:0;
}
.info-label{
  font-size:12px;
  opacity:0.55;
  margin-bottom:3px;
}
.info-value{
  font-size:13px;
  line-height:1.5;
}
.like-row{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:12px;
  padding-top:12px;
  border-top:1px solid rgba(255,255,255,0.15);
}
.like-btn{
  background:none;
  border:none;
  cursor:pointer;
  padding:4px;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:transform 0.15s;
}
.like-btn:active{
  transform:scale(0.85);
}
.like-btn svg{
  width:18px;
  height:18px;
  fill:none;
  stroke:rgba(255,255,255,0.6);
  stroke-width:2;
  transition:fill 0.2s, stroke 0.2s;
}
.like-btn.liked svg{
  fill:#ffffff;
  stroke:#ffffff;
}
.like-count{
  font-size:13px;
  opacity:0.8;
}
.toast{
  position:fixed;
  top:30px;
  left:50%;
  transform:translateX(-50%) translateY(-20px);
  background:rgba(0,0,0,0.7);
  backdrop-filter:blur(10px);
  color:#fff;
  padding:10px 20px;
  border-radius:20px;
  font-size:14px;
  z-index:9999;
  opacity:0;
  transition:opacity 0.3s cubic-bezier(0.34, 1.56, 0.64, 1),
              transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  pointer-events:none;
}
.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}
@media (max-width:720px){
  .island{
    position:static;
    width: calc(100% - 40px) !important;

  }

    left:0;

    flex-direction:column;

    width:auto;

<script>
let currentPicInfo = { desc:'', author:'', link:'', picId:'' };
// 后端先放一边，所有数据走浏览器缓存，后面接后端时把缓存上传即可
const API_BASE = "https://like-api2.lightboxofficial.workers.dev"; // 暂时不用，先存着
async function setBingBg(){
  try{
    const resp = await fetch("https://bing.biturl.top/");
    const img = await resp.json();
    const imgUrl = img.url + "&_t=" + Date.now();
    document.body.style.backgroundImage = `url(${imgUrl})`;
    const copyright = img.copyright || '';
    const match = copyright.match(/^(.*?)\s*\(©\s*(.*?)\)$/);
    if(match){
      currentPicInfo.desc = match[1];
      currentPicInfo.author = match[2];
    }else{
      currentPicInfo.desc = copyright;
      currentPicInfo.author = '';
    }
    currentPicInfo.link = img.copyright_link || '';
    currentPicInfo.picId = img.start_date || 'default';
    document.getElementById('picDesc').textContent = currentPicInfo.desc || '暂无';
    document.getElementById('picAuthor').textContent = currentPicInfo.author || '暂无';
    // 新图片加载后重新拉点赞数
    liked = localStorage.getItem('bing_liked_' + currentPicInfo.picId) === '1';
    loadLikeCount();
  }catch(e){
    console.error("获取壁纸失败",e);
    document.body.style.backgroundImage = `url(https://picsum.photos/id/1018/1920/1080)`;
  }
}
const albumBtn = document.getElementById('albumBtn');
const infoPopup = document.getElementById('infoPopup');
const closeBtn = document.getElementById('closeBtn');
const likeBtn = document.getElementById('likeBtn');
const likeCountEl = document.getElementById('likeCount');
let liked = localStorage.getItem('bing_liked') === '1';
let likeCount = 0;
let apiOnline = false;
async function loadLikeCount(){
  if(!currentPicInfo.picId) return;
  try{
    const res = await fetch(`${API_BASE}?picid=${currentPicInfo.picId}`);
    const data = await res.json();
    likeCount = data.count;
    apiOnline = true;
  }catch(e){
    likeCount = parseInt(localStorage.getItem('bing_likeCount_' + currentPicInfo.picId) || '0', 10);
  }
  renderLike();
}
function renderLike(){
  likeBtn.classList.toggle('liked', liked);
  likeCountEl.textContent = likeCount;
}
likeBtn.addEventListener('click', async function(e){
  e.stopPropagation();
  liked = !liked;
  localStorage.setItem('bing_liked_' + currentPicInfo.picId, liked ? '1' : '0');
  if(apiOnline){
    try{
      const method = liked ? 'POST' : 'DELETE';
      const res = await fetch(`${API_BASE}?picid=${currentPicInfo.picId}`, { method });
      const data = await res.json();
      likeCount = data.count;
    }catch(e){
      likeCount += liked ? 1 : -1;
      localStorage.setItem('bing_likeCount_' + currentPicInfo.picId, likeCount);
    }
  }else{
    likeCount += liked ? 1 : -1;
    localStorage.setItem('bing_likeCount_' + currentPicInfo.picId, likeCount);
  }
  renderLike();
});
loadLikeCount();
albumBtn.addEventListener('click', function(e){
  e.stopPropagation();
  infoPopup.classList.toggle('show');
});
closeBtn.addEventListener('click', function(e){
  e.stopPropagation();
  infoPopup.classList.remove('show');
});
document.addEventListener('click', function(e){
  if(!infoPopup.contains(e.target) && !albumBtn.contains(e.target)){
    infoPopup.classList.remove('show');
  }
});
const shareBtn = document.getElementById('shareBtn');
const toast = document.getElementById('toast');
let toastTimer;
shareBtn.addEventListener('click', async function(e){
  e.stopPropagation();
  const shareUrl = currentPicInfo.link || window.location.href;
  try{
    await navigator.clipboard.writeText(shareUrl);
  }catch(err){
    const input = document.createElement('input');
    input.value = shareUrl;
    document.body.appendChild(input);
    input.select();
    document.execCommand('copy');
    document.body.removeChild(input);
  }
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){
    toast.classList.remove('show');
  }, 2000);
});
setBingBg();
setInterval(setBingBg, 10*60*1000);

// ===== 收藏夹功能 =====
const bookmarkBtn = document.getElementById('bookmarkBtn');
const bookmarkPopup = document.getElementById('bookmarkPopup');
const bookmarkClose = document.getElementById('bookmarkClose');
const bookmarkSearch = document.getElementById('bookmarkSearch');
const bookmarkList = document.getElementById('bookmarkList');
const addBookmarkBtn = document.getElementById('addBookmarkBtn');
const addFolderBtn = document.getElementById('addFolderBtn');
const editPopup = document.getElementById('editPopup');
const editClose = document.getElementById('editClose');
const editName = document.getElementById('editName');
const editUrl = document.getElementById('editUrl');
const editFolder = document.getElementById('editFolder');
const editConfirm = document.getElementById('editConfirm');
const editTitle = document.getElementById('editTitle');
const folderPopup = document.getElementById('folderPopup');
const folderClose = document.getElementById('folderClose');
const folderName = document.getElementById('folderName');
const folderConfirm = document.getElementById('folderConfirm');
const contextMenu = document.getElementById('contextMenu');
const ctxEdit = document.getElementById('ctxEdit');
const ctxDelete = document.getElementById('ctxDelete');
const confirmPopup = document.getElementById('confirmPopup');
const confirmMsg = document.getElementById('confirmMsg');
const confirmOk = document.getElementById('confirmOk');
const confirmCancel = document.getElementById('confirmCancel');
const confirmNo = document.getElementById('confirmNo');

// 数据结构：{ type:'folder', name, children:[] } 或 { type:'item', name, url, folderId }
let bookmarks = JSON.parse(localStorage.getItem('my_bookmarks') || '[]');
let collapsedFolders = JSON.parse(localStorage.getItem('collapsed_folders') || '[]');
let editTarget = null;
let editIsFolder = false;
let ctxTarget = null;
let ctxIsFolder = false;

function saveBookmarks(){
  localStorage.setItem('my_bookmarks', JSON.stringify(bookmarks));
}
function saveCollapsed(){
  localStorage.setItem('collapsed_folders', JSON.stringify(collapsedFolders));
}

function getFavicon(url){
  try{
    const domain = new URL(url).hostname;
    return `https://${domain}/favicon.ico`;
  }catch(e){
    return '';
  }
}

function getAllFolders(items){
  let result = [];
  items.forEach(item => {
    if(item.type === 'folder'){
      result.push(item);
      result = result.concat(getAllFolders(item.children || []));
    }
  });
  return result;
}

function updateFolderSelect(){
  const folders = getAllFolders(bookmarks);
  editFolder.innerHTML = '<option value="">（根目录）</option>';
  folders.forEach((f, i) => {
    const opt = document.createElement('option');
    opt.value = String(i);
    opt.textContent = f.name;
    editFolder.appendChild(opt);
  });
}

function findItem(items, name, url){
  for(let i = 0; i < items.length; i++){
    const item = items[i];
    if(item.type === 'item' && item.name === name && item.url === url) return { items, index: i };
    if(item.type === 'folder'){
      const found = findItem(item.children || [], name, url);
      if(found) return found;
    }
  }
  return null;
}

function findFolder(items, name){
  for(let i = 0; i < items.length; i++){
    if(items[i].type === 'folder' && items[i].name === name) return { items, index: i };
    if(items[i].type === 'folder'){
      const found = findFolder(items[i].children || [], name);
      if(found) return found;
    }
  }
  return null;
}

function renderBookmarks(filter = ''){
  bookmarkList.innerHTML = '';
  renderItems(bookmarks, bookmarkList, filter);
}

function renderItems(items, container, filter){
  items.forEach((item, idx) => {
    if(item.type === 'folder'){
      const isCollapsed = collapsedFolders.includes(item.name);
      const folderEl = document.createElement('div');
      folderEl.className = 'folder-item';
      folderEl.innerHTML = `
        <span class="folder-icon">${isCollapsed ? '📁' : '📂'}</span>
        <span class="folder-name">${item.name}</span>
      `;
      folderEl.onclick = (e) => {
        e.stopPropagation();
        if(isCollapsed){
          collapsedFolders = collapsedFolders.filter(n => n !== item.name);
        }else{
          collapsedFolders.push(item.name);
        }
        saveCollapsed();
        renderBookmarks(bookmarkSearch.value);
      };
      folderEl.oncontextmenu = (e) => {
        e.preventDefault();
        ctxTarget = { items, index: idx };
        ctxIsFolder = true;
        showContextMenu(e.clientX, e.clientY);
      };
      container.appendChild(folderEl);
      if(!isCollapsed){
        const childEl = document.createElement('div');
        childEl.className = 'folder-children';
        renderItems(item.children || [], childEl, filter);
        container.appendChild(childEl);
      }
    }else{
      // 过滤
      if(filter && !item.name.toLowerCase().includes(filter.toLowerCase()) && !item.url.toLowerCase().includes(filter.toLowerCase())){
        return;
      }
      const itemEl = document.createElement('div');
      itemEl.className = 'bookmark-item';
      itemEl.innerHTML = `
        <img src="${getFavicon(item.url)}" onerror="this.style.display='none'">
        <span class="bm-name">${item.name}</span>
      `;
      itemEl.onclick = () => window.open(item.url, '_blank');
      itemEl.oncontextmenu = (e) => {
        e.preventDefault();
        ctxTarget = { items, index: idx };
        ctxIsFolder = false;
        showContextMenu(e.clientX, e.clientY);
      };
      container.appendChild(itemEl);
    }
  });
}

function showContextMenu(x, y){
  contextMenu.style.left = x + 'px';
  contextMenu.style.top = y + 'px';
  contextMenu.classList.add('show');
}
function hideContextMenu(){
  contextMenu.classList.remove('show');
}
contextMenu.addEventListener('contextmenu', (e) => e.preventDefault());

ctxEdit.onclick = (e) => {
  e.stopPropagation();
  hideContextMenu();
  if(!ctxTarget) return;
  const item = ctxTarget.items[ctxTarget.index];
  if(ctxIsFolder){
    editIsFolder = true;
    editTarget = item;
    editTitle.textContent = '重命名文件夹';
    editName.value = item.name;
    editUrl.parentElement.style.display = 'none';
    editFolder.parentElement.style.display = 'none';
  }else{
    editIsFolder = false;
    editTitle.textContent = '编辑收藏';
    editName.value = item.name;
    editUrl.value = item.url;
    editUrl.parentElement.style.display = '';
    editFolder.parentElement.style.display = '';
  }
  editPopup.classList.add('show');
};

ctxDelete.onclick = (e) => {
  e.stopPropagation();
  hideContextMenu();
  if(!ctxTarget) return;
  const item = ctxTarget.items[ctxTarget.index];
  if(!item) return;
  confirmMsg.textContent = `确定删除"${item.name}"？`;
  confirmPopup.classList.add('show');
};

confirmOk.onclick = (e) => {
  e.stopPropagation();
  if(!ctxTarget) return;
  ctxTarget.items.splice(ctxTarget.index, 1);
  saveBookmarks();
  renderBookmarks(bookmarkSearch.value);
  confirmPopup.classList.remove('show');
};

confirmCancel.onclick = (e) => {
  e.stopPropagation();
  confirmPopup.classList.remove('show');
};

confirmNo.onclick = (e) => {
  e.stopPropagation();
  confirmPopup.classList.remove('show');
};
bookmarkBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  updateFolderSelect();
  renderBookmarks(bookmarkSearch.value);
  bookmarkPopup.classList.toggle('show');
});
bookmarkClose.addEventListener('click', (e) => {
  e.stopPropagation();
  bookmarkPopup.classList.remove('show');
});
bookmarkSearch.addEventListener('input', () => {
  renderBookmarks(bookmarkSearch.value);
});

addBookmarkBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  editTarget = null;
  editIsFolder = false;
  editTitle.textContent = '添加收藏';
  editName.value = '';
  editUrl.value = '';
  editUrl.parentElement.style.display = '';
  editFolder.parentElement.style.display = '';
  updateFolderSelect();
  editPopup.classList.add('show');
});

addFolderBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  folderName.value = '';
  folderPopup.classList.add('show');
});

editClose.addEventListener('click', (e) => {
  e.stopPropagation();
  editPopup.classList.remove('show');
});

editConfirm.addEventListener('click', () => {
  const name = editName.value.trim();
  if(!name) return;
  if(editIsFolder){
    // 重命名文件夹
    if(editTarget){
      const found = findFolder(bookmarks, editTarget.name);
      if(found) found.items[found.index].name = name;
    }else{
      bookmarks.push({ type:'folder', name, children:[] });
    }
  }else{
    let url = editUrl.value.trim();
    if(!url) return;
    if(!url.startsWith('http')) url = 'https://' + url;
    const folderIdx = parseInt(editFolder.value);
    const newItem = { type:'item', name, url };
    if(!isNaN(folderIdx) && folderIdx >= 0){
      const folders = getAllFolders(bookmarks);
      if(folders[folderIdx]){
        folders[folderIdx].children.push(newItem);
      }else{
        bookmarks.push(newItem);
      }
    }else{
      bookmarks.push(newItem);
    }
  }
  saveBookmarks();
  renderBookmarks(bookmarkSearch.value);
  editPopup.classList.remove('show');
});

folderClose.addEventListener('click', (e) => {
  e.stopPropagation();
  folderPopup.classList.remove('show');
});

folderConfirm.addEventListener('click', () => {
  const name = folderName.value.trim();
  if(!name) return;
  bookmarks.push({ type:'folder', name, children:[] });
  saveBookmarks();
  renderBookmarks(bookmarkSearch.value);
  folderPopup.classList.remove('show');
});

// 点击弹窗外部关闭
document.addEventListener('click', (e) => {
  if(!bookmarkPopup.contains(e.target) && !bookmarkBtn.contains(e.target)){
    bookmarkPopup.classList.remove('show');
  }
  if(!editPopup.contains(e.target)){
    editPopup.classList.remove('show');
  }
  if(!folderPopup.contains(e.target)){
    folderPopup.classList.remove('show');
  }
  if(!confirmPopup.contains(e.target)){
    confirmPopup.classList.remove('show');
  }
  if(!contextMenu.contains(e.target)){
    hideContextMenu();
  }
});
</script>
</body>
</html>
