<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  width:100%;
  height:100%;
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  background-attachment:fixed;
  padding-bottom: 80px;
  font-family: system-ui, sans-serif;
}

/* 通用浮岛 */
.island{
  position:fixed;
  bottom:20px;
  background:rgba(0,0,0,0.45);
  backdrop-filter: blur(10px);
  border-radius: 8px;
  height: 45px;
  padding: 0 12px;
  box-sizing: border-box;
  display:flex;
  align-items:center;
  gap:8px;
  color:#fff;
}

/* 中间主浮岛 */
.island-main{
  left:50%;
  transform:translateX(-50%);
  width: 500px;
  justify-content: center;
}

/* 左侧浮岛 */
.island-left{
  left: 20px;
  width:250px;
  justify-content:flex-start;
  padding-left:16px;
}

/* 右侧浮岛 */
.island-right{
  right: 20px;
  width:250px;
  justify-content:flex-end;
  padding-right:16px;
}

/* 通用图标按钮：纯图标，无背景无边框 */
.icon-btn{
  width:auto;
  height:auto;
  border-radius:0;
  border:none;
  background:transparent;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:6px;
  transition:opacity 0.2s, transform 0.15s;
  flex-shrink:0;
}
.icon-btn:hover{
  opacity:0.7;
}
.icon-btn:active{
  transform:scale(0.92);
}
.icon-btn svg{
  width:20px;
  height:20px;
  stroke:rgba(255,255,255,0.75);
}

/* 弹出小框：非线性回弹动画 */
.info-popup{
  position:fixed;
  left:36px;
  bottom:80px;
  width:280px;
  background:rgba(0,0,0,0.65);
  backdrop-filter: blur(14px);
  border-radius:14px;
  padding:16px;
  color:#fff;
  box-shadow:0 8px 32px rgba(0,0,0,0.35);
  z-index:999;
  opacity:0;
  transform:scale(0.85) translateY(10px);
  transform-origin:bottom left;
  transition:opacity 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
              transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  pointer-events:none;
}
.info-popup.show{
  opacity:1;
  transform:scale(1) translateY(0);
  pointer-events:auto;
}
.info-popup-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
  font-size:15px;
  font-weight:600;
}
.info-popup .close-btn{
  width:24px;
  height:24px;
  border-radius:50%;
  border:none;
  background:rgba(255,255,255,0.18);
  color:#fff;
  cursor:pointer;
  font-size:13px;
  line-height:1;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:background 0.2s;
}
.info-popup .close-btn:hover{
  background:rgba(255,255,255,0.35);
}
.info-item{
  margin-bottom:10px;
}
.info-item:last-child{
  margin-bottom:0;
}
.info-label{
  font-size:12px;
  opacity:0.55;
  margin-bottom:3px;
}
.info-value{
  font-size:13px;
  line-height:1.5;
}

/* 点赞行 */
.like-row{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:12px;
  padding-top:12px;
  border-top:1px solid rgba(255,255,255,0.15);
}
.like-btn{
  background:none;
  border:none;
  cursor:pointer;
  padding:4px;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:transform 0.15s;
}
.like-btn:active{
  transform:scale(0.85);
}
.like-btn svg{
  width:18px;
  height:18px;
  fill:none;
  stroke:rgba(255,255,255,0.6);
  stroke-width:2;
  transition:fill 0.2s, stroke 0.2s;
}
.like-btn.liked svg{
  fill:#ffffff;
  stroke:#ffffff;
}
.like-count{
  font-size:13px;
  opacity:0.8;
}

/* Toast 提示：非线性动画 */
.toast{
  position:fixed;
  top:30px;
  left:50%;
  transform:translateX(-50%) translateY(-20px);
  background:rgba(0,0,0,0.7);
  backdrop-filter:blur(10px);
  color:#fff;
  padding:10px 20px;
  border-radius:20px;
  font-size:14px;
  z-index:9999;
  opacity:0;
  transition:opacity 0.3s cubic-bezier(0.34, 1.56, 0.64, 1),
              transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  pointer-events:none;
}
.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* 窄屏堆叠 */
@media (max-width:720px){
  .island{
    position:static;
    width: calc(100% - 40px) !important;
    margin:8px auto;
  }
  .island-container{
    position:fixed;
    bottom:16px;
    left:0;
    right:0;
    display:flex;
    flex-direction:column;
  }
  .info-popup{
    left:20px;
    right:20px;
    width:auto;
  }
}
</style>
</head>
<body>

<div class="island-container">
  <div class="island island-left">
    <button class="icon-btn" id="albumBtn" title="壁纸信息">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
        <circle cx="8.5" cy="8.5" r="1.5"></circle>
        <polyline points="21 15 16 10 5 21"></polyline>
      </svg>
    </button>
  </div>

  <div class="island island-main">
    <!-- 中间主导航 -->
  </div>

  <div class="island island-right">
    <!-- 右侧功能区 -->
  </div>
</div>

<!-- 弹出小框 -->
<div class="info-popup" id="infoPopup">
  <div class="info-popup-header">
    <span>喜欢吗？</span>
    <button class="close-btn" id="closeBtn">✕</button>
  </div>
  <div class="info-item">
    <div class="info-label">地区 / 场景</div>
    <div class="info-value" id="picDesc">加载中...</div>
  </div>
  <div class="info-item">
    <div class="info-label">拍摄者</div>
    <div class="info-value" id="picAuthor">加载中...</div>
  </div>
  <div class="like-row">
    <button class="like-btn" id="likeBtn">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
      </svg>
    </button>
    <span class="like-count" id="likeCount">0</span>
    <button class="like-btn" id="shareBtn" style="margin-left:auto" title="分享必应链接">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px">
        <circle cx="18" cy="5" r="3"></circle>
        <circle cx="6" cy="12" r="3"></circle>
        <circle cx="18" cy="19" r="3"></circle>
        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
        <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
      </svg>
    </button>
  </div>
</div>

<!-- Toast 提示 -->
<div class="toast" id="toast">链接已复制</div>

<script>
let currentPicInfo = { desc:'', author:'', link:'' };

async function setBingBg(){
  try{
    const resp = await fetch("https://bing.biturl.top/");
    const img = await resp.json();
    const imgUrl = img.url + "&_t=" + Date.now();
    document.body.style.backgroundImage = `url(${imgUrl})`;

    const copyright = img.copyright || '';
    const match = copyright.match(/^(.*?)\s*\(©\s*(.*?)\)$/);
    if(match){
      currentPicInfo.desc = match[1];
      currentPicInfo.author = match[2];
    }else{
      currentPicInfo.desc = copyright;
      currentPicInfo.author = '';
    }
    currentPicInfo.link = img.copyright_link || '';

    document.getElementById('picDesc').textContent = currentPicInfo.desc || '暂无';
    document.getElementById('picAuthor').textContent = currentPicInfo.author || '暂无';
  }catch(e){
    console.error("获取壁纸失败",e);
    document.body.style.backgroundImage = `url(https://picsum.photos/id/1018/1920/1080)`;
  }
}

// 弹窗开关
const albumBtn = document.getElementById('albumBtn');
const infoPopup = document.getElementById('infoPopup');
const closeBtn = document.getElementById('closeBtn');

// 点赞功能（后端KV存储 + 本地记录用户状态）
const likeBtn = document.getElementById('likeBtn');
const likeCountEl = document.getElementById('likeCount');
let liked = localStorage.getItem('bing_liked') === '1';
let likeCount = 0;
let apiOnline = false;

// 页面加载时从后端拉点赞数
async function loadLikeCount(){
  try{
    const res = await fetch('/api/like');
    const data = await res.json();
    likeCount = data.count;
    apiOnline = true;
  }catch(e){
    // 后端不可用，降级本地
    likeCount = parseInt(localStorage.getItem('bing_likeCount') || '128', 10);
  }
  renderLike();
}

function renderLike(){
  likeBtn.classList.toggle('liked', liked);
  likeCountEl.textContent = likeCount;
}

likeBtn.addEventListener('click', async function(e){
  e.stopPropagation();
  liked = !liked;
  localStorage.setItem('bing_liked', liked ? '1' : '0');

  if(apiOnline){
    // 调用后端
    try{
      const method = liked ? 'POST' : 'DELETE';
      const res = await fetch('/api/like', { method });
      const data = await res.json();
      likeCount = data.count;
    }catch(e){
      // 降级本地计数
      likeCount += liked ? 1 : -1;
      localStorage.setItem('bing_likeCount', likeCount);
    }
  }else{
    // 纯本地模式
    likeCount += liked ? 1 : -1;
    localStorage.setItem('bing_likeCount', likeCount);
  }
  renderLike();
});

loadLikeCount();

albumBtn.addEventListener('click', function(e){
  e.stopPropagation();
  infoPopup.classList.toggle('show');
});
closeBtn.addEventListener('click', function(e){
  e.stopPropagation();
  infoPopup.classList.remove('show');
});
document.addEventListener('click', function(e){
  if(!infoPopup.contains(e.target) && !albumBtn.contains(e.target)){
    infoPopup.classList.remove('show');
  }
});

// 分享功能：复制链接 + toast
const shareBtn = document.getElementById('shareBtn');
const toast = document.getElementById('toast');
let toastTimer;

shareBtn.addEventListener('click', async function(e){
  e.stopPropagation();
  const shareUrl = currentPicInfo.link || window.location.href;
  try{
    await navigator.clipboard.writeText(shareUrl);
  }catch(err){
    // 降级方案
    const input = document.createElement('input');
    input.value = shareUrl;
    document.body.appendChild(input);
    input.select();
    document.execCommand('copy');
    document.body.removeChild(input);
  }
  // 显示toast
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){
    toast.classList.remove('show');
  }, 2000);
});

setBingBg();
setInterval(setBingBg, 10*60*1000);
</script>

</body>
</html>
