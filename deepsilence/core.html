<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DeepSilence · Core</title>
<link rel="stylesheet" href="core.css">
</head>
<body>

<div class="win term-window" id="term">
  <div class="win-head" id="termHead">
    <div class="win-head-left">
      <div class="win-logo">
        <svg viewBox="0 0 24 24"><path d="M4 17l6-6-6-6"/><path d="M12 19h8"/></svg>
      </div>
      <div class="win-title">DeepSilence</div>
    </div>
    <div class="win-ctrls">
      <button class="wbtn min" id="termMin" title="最小化"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
      <button class="wbtn max" id="termMax" title="最大化"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="1"/></svg></button>
      <button class="wbtn close" id="termClose" title="关闭"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6l-12 12"/></svg></button>
    </div>
  </div>
  <div class="win-body">
    <div class="term-scroll" id="termOut"></div>
  </div>
  <div class="rs top"></div><div class="rs bottom"></div>
  <div class="rs left"></div><div class="rs right"></div>
  <div class="rs top-left"></div><div class="rs top-right"></div>
  <div class="rs bottom-left"></div><div class="rs bottom-right"></div>
</div>

<div class="chip" id="chip">
  <svg viewBox="0 0 24 24"><path d="M4 17l6-6-6-6"/><path d="M12 19h8"/></svg>
  <span>终端</span>
</div>

<div id="winLayer"></div>

<script src="core.js"></script>
</body>
</html>
