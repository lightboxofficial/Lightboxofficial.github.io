<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{
  margin:0;
  padding:0;
  background:transparent;
  color:rgba(255,255,255,.82);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
*{box-sizing:border-box}
::-webkit-scrollbar{width:0;height:0}
*{scrollbar-width:none;-ms-overflow-style:none}

.wrap{padding:38px 44px 48px;animation:in .5s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.eyebrow{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:rgba(255,255,255,.32);margin-bottom:14px}
h1{font-size:30px;font-weight:300;letter-spacing:.04em;margin:0 0 28px;color:#fff}

.list{border-top:1px solid rgba(255,255,255,.06)}
.item{
  display:flex;
  gap:18px;
  padding:18px 2px;
  border-bottom:1px solid rgba(255,255,255,.06);
  transition:padding-left .22s ease,background .22s ease;
}
.item:hover{padding-left:10px;background:rgba(255,255,255,.03)}
.num{
  font-size:11px;
  color:rgba(110,231,183,.7);
  letter-spacing:.14em;
  flex-shrink:0;
  padding-top:3px;
}
.body .h{font-size:13.5px;color:rgba(255,255,255,.88);margin-bottom:7px}
.body .p{font-size:12.5px;line-height:1.85;color:rgba(255,255,255,.4)}
.foot{margin-top:36px;font-size:11.5px;letter-spacing:.1em;color:rgba(255,255,255,.24)}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">About</div>
  <h1>关于这个内核</h1>
  <div class="list">
    <div class="item">
      <div class="num">01</div>
      <div class="body">
        <div class="h">为什么要重写</div>
        <div class="p">旧版把页面、逻辑、样式全部内联在三份互不引用的 html 里。新版拆成内核 + 页面 + 脚本三层，页面只管内容，内核只管调度。</div>
      </div>
    </div>
    <div class="item">
      <div class="num">02</div>
      <div class="body">
        <div class="h">为什么页面要全透明</div>
        <div class="p">页面被装进窗口的 iframe，窗口本身是毛玻璃。若页面自带底色，就会出现一圈明显的方块边界。透明是唯一能让两者浑然一体的做法。</div>
      </div>
    </div>
    <div class="item">
      <div class="num">03</div>
      <div class="body">
        <div class="h">为什么脚本用 txt</div>
        <div class="p">像 .bat 一样：一行一条语句，顺序执行，逐行回显。不需要编译，不需要构建工具，直接放在目录里就能被终端识别并运行。</div>
      </div>
    </div>
  </div>
  <div class="foot">DEEPSILENCE / ABOUT</div>
</div>
</body>
</html>
