<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>OriginalDeepsilenceHeart (ODH) · 窗口引擎</title>
  <meta name="description" content="OriginalDeepsilenceHeart（ODH）窗口引擎：排版文件 + 指令事件文件 + 全局指令文件">
  <link rel="stylesheet" href="engine.css">
</head>
<body class="lb-desktop">

  <!-- 左上角启动器：圆形 logo 按钮 + 点击弹出的状态条 -->
  <div class="lb-launcher" id="lbLauncher">
    <button class="lb-launcher-btn" id="lbLauncherBtn" type="button" title="OriginalDeepsilenceHeart (ODH)" aria-label="OriginalDeepsilenceHeart (ODH)" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="9.2"/>
        <path d="M12 16.3c-2.4-1.6-3.7-3-3.7-4.4a2.1 2.1 0 0 1 3.7-1.4 2.1 2.1 0 0 1 3.7 1.4c0 1.4-1.3 2.8-3.7 4.4z"/>
      </svg>
    </button>
    <div class="lb-launcher-bar" id="lbLauncherBar">
      <span class="lb-brand">ODH <em>OriginalDeepsilenceHeart</em></span>
      <span class="lb-status" id="lbStatus">启动中…</span>
      <button class="lb-logbtn" id="lbWallBtn" type="button">壁纸</button>
      <button class="lb-logbtn" id="lbLogBtn" type="button">日志</button>
    </div>
  </div>

  <div class="lb-wallpanel" id="lbWallPanel">
    <div class="lb-wallhead">Wallpaper · 桌面壁纸</div>
    <div class="lb-wallrow">
      <input class="lb-wallinput" id="lbWallInput" type="url" placeholder="图片链接，留空使用 Bing 每日壁纸">
      <button class="lb-wallgo" id="lbWallApply" type="button">应用</button>
    </div>
    <div class="lb-wallfoot">
      <span>默认使用 Bing 每日壁纸，留空则恢复</span>
      <button class="lb-wallreset" id="lbWallReset" type="button">恢复默认</button>
    </div>
  </div>

  <div class="lb-logpanel" id="lbLogPanel">
    <div class="lb-loghead">OriginalDeepsilenceHeart Log · 指令执行记录</div>
    <div class="lb-log-list" id="lbLogList"></div>
  </div>

  <div class="lb-dock" id="lbDock"></div>
  <div class="lb-toasts" id="lbToasts"></div>

  <!-- file:// 直开时的离线镜像（由三件套自动生成） -->
  <script src="mirror.js"></script>
  <!-- 引擎本体 -->
  <script src="engine.js"></script>
</body>
</html>
